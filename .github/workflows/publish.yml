name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Publish
        run: |
          version=$(grep '^version =' Cargo.toml | head -n1 | sed -E 's/version = "(.*)"/\1/')
          echo "Crate version: $version"

          # skip any version that has already been published so reruns are safe
          if curl -sf "https://crates.io/api/v1/crates/ngrok-axum" \
            | jq -e --arg v "$version" '.versions[] | select(.num == $v)' > /dev/null 2>&1; then
            echo "ngrok-axum@${version} already exists on crates.io. Skipping publish."
          else
            echo "Publishing release version $version"
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Tag Release
        run: |
          git config user.name "GitHub Action"
          git config user.email noreply@ngrok.com
          version=$(grep '^version =' Cargo.toml | head -n1 | sed -E 's/version = "(.*)"/\1/')
          tag="v$version"
          echo "Tagging release: $tag"
          git fetch --tags
          if git rev-parse "refs/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists, skipping tag creation."
          else
            git tag -a -m "Version ${version}" "$tag"
            git push --tags
          fi
