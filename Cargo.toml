[package]
name = "ngrok-axum"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Serve an Axum app through an ngrok tunnel with one call."
repository = "https://github.com/ishanj12/ngrok-axum"

[dependencies]
axum = { version = "0.7.4", features = ["tokio"] }
axum-core = "0.4.5"
futures = "0.3"
hyper = { version = "1.1.0" }
hyper-util = { version = "0.1.3", features = ["tokio", "server", "http1", "http2"] }
ngrok = { version = "0.19.0", features = ["axum"] }
tokio = { version = "1.23.0", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tokio = { version = "1.23.0", features = ["full"] }
